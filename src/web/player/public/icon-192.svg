<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="disc-body" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a2a35"/>
      <stop offset="50%" stop-color="#14141c"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="neon-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760"/>
      <stop offset="50%" stop-color="#00c49f"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="hp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow-deep" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#1ed760" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- 3D Vinyl Disc -->
  <g filter="url(#shadow-deep)">
    <circle cx="256" cy="256" r="180" fill="url(#disc-body)" stroke="#333" stroke-width="4"/>
    <circle cx="256" cy="256" r="160" stroke="rgba(255,255,255,0.06)" stroke-width="3" fill="none"/>
    <circle cx="256" cy="256" r="140" stroke="rgba(0,0,0,0.6)" stroke-width="3" fill="none"/>
    <circle cx="256" cy="256" r="120" stroke="rgba(255,255,255,0.04)" stroke-width="3" fill="none"/>
    <circle cx="256" cy="256" r="100" stroke="rgba(0,0,0,0.5)" stroke-width="3" fill="none"/>
    
    <!-- Vinyl Center Label -->
    <circle cx="256" cy="256" r="70" fill="url(#neon-sheen)" filter="url(#glow-green)"/>
    <circle cx="256" cy="256" r="54" stroke="rgba(255,255,255,0.3)" stroke-width="3" fill="none"/>
    
    <!-- Spindle Hole with 3D Depth -->
    <circle cx="256" cy="256" r="20" fill="#000000" stroke="#222" stroke-width="4"/>
    <circle cx="252" cy="252" r="5" fill="rgba(255,255,255,0.7)"/>
  </g>

  <!-- 3D Studio Headphones Over Disc -->
  <g filter="url(#shadow-deep)">
    <!-- Headband Arc -->
    <path d="M120 280 C110 110, 402 110, 392 280" fill="none" stroke="url(#hp-grad)" stroke-width="36" stroke-linecap="round"/>
    <path d="M148 240 C140 135, 372 135, 364 240" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="8" stroke-linecap="round"/>

    <!-- Left Ear Cup -->
    <rect x="80" y="250" width="56" height="110" rx="28" fill="#13151f" stroke="#475569" stroke-width="5"/>
    <rect x="90" y="262" width="36" height="86" rx="18" fill="url(#neon-sheen)"/>
    <rect x="96" y="270" width="8" height="40" rx="4" fill="rgba(255,255,255,0.6)"/>

    <!-- Right Ear Cup -->
    <rect x="376" y="250" width="56" height="110" rx="28" fill="#13151f" stroke="#475569" stroke-width="5"/>
    <rect x="386" y="262" width="36" height="86" rx="18" fill="url(#neon-sheen)"/>
    <rect x="392" y="270" width="8" height="40" rx="4" fill="rgba(255,255,255,0.6)"/>
  </g>

  <!-- Sound Waves Aura -->
  <g fill="#1ed760" opacity="0.9">
    <circle cx="256" cy="410" r="10" filter="url(#glow-green)"/>
    <circle cx="216" cy="414" r="7" filter="url(#glow-green)"/>
    <circle cx="296" cy="414" r="7" filter="url(#glow-green)"/>
    <circle cx="180" cy="422" r="5"/>
    <circle cx="332" cy="422" r="5"/>
  </g>
</svg>
